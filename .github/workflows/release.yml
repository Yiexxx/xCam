name: Android Release APK

# Build and publish a signed APK after every successful push to the feature branch.
# Android app version remains fixed at versionName 1.0.0 / versionCode 1.
# Release tags are unique build identifiers and do not change the app version.

on:
  push:
    branches:
      - 'feature/chinese-ui-launcher'
      - 'feature/photo-dynamic-island'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare signing key
        run: |
          set -euo pipefail
          test -s .github/keystore/xcam-release.jks.base64
          base64 --decode .github/keystore/xcam-release.jks.base64 > app/release-key.jks
          test -s app/release-key.jks
          chmod 600 app/release-key.jks

      - name: Set fixed app version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          echo "version_name=1.0.0" >> "${GITHUB_OUTPUT}"
          echo "version_code=1" >> "${GITHUB_OUTPUT}"
          # Unique tag per build; APK's Android version remains 1.0.0 (1).
          echo "tag_name=xcam-v1.0.0-build-${GITHUB_RUN_NUMBER}" >> "${GITHUB_OUTPUT}"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PAPP_VERSION_CODE=1 \
            -PAPP_VERSION_NAME=1.0.0
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          set -euo pipefail
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/xCam-1.0.0-build-${GITHUB_RUN_NUMBER}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: xCam v1.0.0
          body: |
            Android app version: 1.0.0
            Android versionCode: 1
            Build: ${{ github.run_number }}
          files: app/build/outputs/apk/release/xCam-1.0.0-build-${{ github.run_number }}.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xCam-1.0.0-build-${{ github.run_number }}
          path: app/build/outputs/apk/release/xCam-1.0.0-build-${{ github.run_number }}.apk
          if-no-files-found: error
