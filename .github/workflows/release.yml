name: Android Release APK

# Release version: 1.0.0 (versionCode 1) - visible stacked photo layers

on:
  push:
    branches:
      - 'feature/chinese-ui-launcher'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare signing key
        run: |
          set -euo pipefail
          test -s .github/keystore/xcam-release.jks.base64
          base64 --decode .github/keystore/xcam-release.jks.base64 > app/release-key.jks
          test -s app/release-key.jks
          chmod 600 app/release-key.jks

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
            V_CODE=$(git tag --list 'v*' | wc -l)
          else
            V_NAME="1.0.0"
            V_CODE=1
          fi
          ./gradlew assembleRelease -PAPP_VERSION_CODE="$V_CODE" -PAPP_VERSION_NAME="$V_NAME"

      - name: Rename APK
        run: |
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          elif [[ "${GITHUB_EVENT_NAME}" == "push" ]] && git log -1 --format=%s | grep -q '^release:'; then
            TAG_NAME="v1.0.0"
          else
            TAG_NAME="manual-${GITHUB_RUN_NUMBER}"
          fi
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/${REPO_NAME}-${TAG_NAME}.apk"

      - name: Publish GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          target_commitish: ${{ github.sha }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed APK artifact
        if: github.ref_type != 'tag' && !(github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:'))
        uses: actions/upload-artifact@v4
        with:
          name: xCam-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
