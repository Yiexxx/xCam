name: Android Release APK

# Build and publish a signed APK automatically after every successful
# push to the feature branch. The main branch is intentionally untouched.

on:
  push:
    branches:
      - 'feature/chinese-ui-launcher'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Prepare signing key
        run: |
          set -euo pipefail
          test -s .github/keystore/xcam-release.jks.base64
          base64 --decode .github/keystore/xcam-release.jks.base64 > app/release-key.jks
          test -s app/release-key.jks
          chmod 600 app/release-key.jks

      - name: Determine release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            V_NAME="${GITHUB_REF_NAME#v}"
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            V_NAME="1.0.${GITHUB_RUN_NUMBER}"
            TAG_NAME="v${V_NAME}"
          fi
          V_CODE="${GITHUB_RUN_NUMBER}"
          echo "version_name=${V_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${V_CODE}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG_NAME}" >> "${GITHUB_OUTPUT}"
          echo "APK will be released as ${TAG_NAME} (versionCode ${V_CODE})"

      - name: Build signed Release APK
        env:
          RELEASE_STORE_FILE: release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleRelease \
            -PAPP_VERSION_CODE="${{ steps.version.outputs.version_code }}" \
            -PAPP_VERSION_NAME="${{ steps.version.outputs.version_name }}"
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          set -euo pipefail
          REPO_NAME="${GITHUB_REPOSITORY##*/}"
          cp app/build/outputs/apk/release/app-release.apk \
            "app/build/outputs/apk/release/${REPO_NAME}-${{ steps.version.outputs.tag_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: xCam ${{ steps.version.outputs.tag_name }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: xCam-${{ steps.version.outputs.tag_name }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
